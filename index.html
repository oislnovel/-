<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>日本語読み上げ</title>
    <meta name="description" content="本文を貼り付けて、Windows Edgeなどの日本語音声で読み上げる最小構成アプリです。" />
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>日本語読み上げ</h1>
      <p class="lead">本文を貼り付け、音声を選んで読み上げます。Windows Edgeでは Microsoft Ayumi などの日本語音声を選べます。</p>

      <label for="textInput">本文貼り付け欄</label>
      <textarea id="textInput" autofocus placeholder="ここに読み上げたい日本語の本文を貼り付けてください。"></textarea>

      <div class="meta" aria-live="polite">
        <span id="charCount">0文字</span>
        <span id="status">準備できています。</span>
      </div>

      <label for="voiceSelect">音声選択</label>
      <select id="voiceSelect"></select>

      <div class="buttons">
        <button id="speakButton" type="button">読み上げ</button>
        <button id="stopButton" type="button">停止</button>
      </div>
    </main>

    <script src="src/app.js" defer></script>
  </body>
</html>
